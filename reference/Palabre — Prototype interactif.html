<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palabre — Prototype</title>
<style>
:root{--bg:#F6F7F4;--sf:#fff;--tx:#14201C;--mu:#5B6B65;--bd:#DDE3DF;--pr:#0F5C4A;--pt:#fff;--ac:#E8892B;--ok:#157347;--okb:#E3F4EA;--wa:#8A5A00;--wab:#FFF1D6;--er:#B3261E;--erb:#FCE4E2;--nw:#1F5FA8;--nwb:#E2EEFB;--cd:#0E1714;--ct:#D7E7E1;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1311;--sf:#141D1A;--tx:#E8EFEC;--mu:#9DB0A8;--bd:#26332F;--pr:#3FBF9B;--pt:#07130F;--ac:#F2A04A;--ok:#6FD79B;--okb:#12301F;--wa:#F2C46B;--wab:#33280E;--er:#FF8A80;--erb:#3A1714;--nw:#8DB9F0;--nwb:#13243A;--cd:#070C0A;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0C1311;--sf:#141D1A;--tx:#E8EFEC;--mu:#9DB0A8;--bd:#26332F;--pr:#3FBF9B;--pt:#07130F;--ac:#F2A04A;--ok:#6FD79B;--okb:#12301F;--wa:#F2C46B;--wab:#33280E;--er:#FF8A80;--erb:#3A1714;--nw:#8DB9F0;--nwb:#13243A;--cd:#070C0A;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}h1{font-size:clamp(1.8rem,5vw,2.8rem)}h2{font-size:1.4rem}h3{font-size:1.1rem}
a{color:var(--pr)}button,input,select,textarea{font:inherit;color:inherit}
.demo{background:var(--wab);color:var(--wa);font-size:.82rem;text-align:center;padding:6px 12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--sf);border-bottom:1px solid var(--bd)}
.hd{max-width:1080px;margin:auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2rem;cursor:pointer;background:none;border:0;padding:0}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}
nav button{background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--mu)}
nav button:hover,nav button.on{background:var(--bg);color:var(--tx)}
main{max-width:1080px;margin:auto;padding:24px 16px 64px}
.btn{background:var(--pr);color:var(--pt);border:0;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;font-weight:600}
.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:var(--er);color:#fff}.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.fc{cursor:pointer;display:flex;flex-direction:column;gap:8px}.fc:hover{border-color:var(--pr)}
.fc h3{margin:0}.mu{color:var(--mu);font-size:.9rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.b{display:inline-flex;gap:4px;align-items:center;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px}
.b.ok{background:var(--okb);color:var(--ok)}.b.re{background:var(--wab);color:var(--wa)}.b.fl{background:var(--erb);color:var(--er)}.b.new{background:var(--nwb);color:var(--nw)}
.ch{font-size:.8rem;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 9px}
.hero{padding:32px 0 24px;max-width:720px}.hero p{font-size:1.1rem;color:var(--mu)}
.sb{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.sb input{flex:1;min-width:200px}
input,select,textarea{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}.fe{color:var(--er);font-size:.85rem;margin-top:4px}
input.bad,select.bad,textarea.bad{border-color:var(--er)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fl2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lay{display:grid;grid-template-columns:1fr 280px;gap:20px}
pre{background:var(--cd);color:var(--ct);padding:14px;border-radius:10px;overflow-x:auto;font-size:.85rem;margin:8px 0}
.bn{padding:12px 14px;border-radius:10px;margin:12px 0;font-size:.95rem}.bn.re{background:var(--wab);color:var(--wa)}.bn.fl{background:var(--erb);color:var(--er)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:12px 0}.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--mu)}.tabs button.on{border-color:var(--pr);color:var(--tx);font-weight:600}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:30;padding:16px}.md{max-width:460px;width:100%}
.ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40;max-width:90%}
.em{text-align:center;padding:36px 16px}.sk{height:84px;border-radius:14px;background:var(--bd);margin-bottom:12px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.4}}
.pg{height:6px;background:var(--bd);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--pr)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:.92rem}
.tw{overflow-x:auto}
@media(max-width:760px){.lay,.two,.fl2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style></head><body>
<div class="demo">Prototype de maquette · données fictives · rien n'est envoyé ni enregistré sur un serveur</div>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAYS=["Sénégal","Côte d'Ivoire","Cameroun","Mali","Bénin","Togo","Burkina Faso","Guinée"],SV=["Wave","Orange Money","MTN MoMo","SMS","USSD","Hébergement"],TE=["Node.js","PHP","Python","Java","JavaScript"];
const STL={ok:'✔ Confirmée (contexte défini)',re:'⟳ À revérifier',fl:'⚑ Signalée',new:'● Récente, peu vérifiée'};
const EX="// Exemple de démonstration — non vérifié\n";
let FI=[
{id:1,t:"Intégrer Wave dans une application web au Sénégal",s:"Créer une session de paiement, rediriger le client et traiter le retour.",p:"Sénégal",sv:"Wave",te:"Node.js",st:"ok",c:14,d:"il y a 3 j",a:"Awa Ndiaye",v:"Checkout (version de démo)",steps:"Créer la session côté serveur|Rediriger vers l'URL de paiement|Traiter le retour et vérifier le statut",code:EX+"const s = await createCheckout({\n  amount: 5000, currency: 'XOF',\n  successUrl: BASE + '/ok', errorUrl: BASE + '/ko'\n});\nres.redirect(s.launchUrl);",x:"Montant envoyé en décimal au lieu d'un entier|Testé uniquement en bac à sable"},
{id:2,t:"Comprendre les erreurs de signature d'une requête de paiement",s:"Une signature rejetée vient souvent de l'ordre des champs ou de l'encodage.",p:"Côte d'Ivoire",sv:"Orange Money",te:"PHP",st:"ok",c:9,d:"il y a 1 sem.",a:"Koffi Yao",v:"v2 (démo)",steps:"Normaliser l'ordre des champs|Encoder en UTF-8|Recalculer et comparer la signature",code:"",x:"Espaces invisibles dans la clé|Un seul pays testé"},
{id:3,t:"Gérer les accusés de réception SMS selon le fournisseur",s:"Les statuts de livraison arrivent avec des formats et des délais variables.",p:"Cameroun",sv:"SMS",te:"Python",st:"re",c:3,d:"il y a 5 mois",a:"Brice Mbarga",v:"API v1 (ancienne)",steps:"Exposer une URL de rappel|Mapper les statuts du fournisseur|Relancer si aucun accusé sous 24 h",code:EX+"STATUS = {'DELIVRD': 'delivered', 'UNDELIV': 'failed'}\ndef on_dlr(req):\n    return STATUS.get(req.form['status'], 'unknown')",x:"Statuts renommés selon le fournisseur|Dernière vérification ancienne"},
{id:4,t:"Diagnostiquer une erreur de callback après un paiement",s:"Le webhook n'arrive pas : vérifier l'URL publique, le TLS et les relances.",p:"Mali",sv:"MTN MoMo",te:"Node.js",st:"fl",c:5,d:"il y a 2 mois",a:"Fatoumata Keïta",v:"Collection v1",steps:"Vérifier l'URL publique en HTTPS|Consulter les journaux d'envoi|Rendre le traitement idempotent",code:EX+"app.post('/callback', (req, res) => {\n  if (seen(req.body.ref)) return res.sendStatus(200);\n  save(req.body); res.sendStatus(200);\n});",x:"Certificat intermédiaire manquant|Un contributeur signale un comportement différent"},
{id:5,t:"Adapter une intégration API à une version donnée",s:"Migrer les appels d'une ancienne version en gérant les champs renommés.",p:"Bénin",sv:"MTN MoMo",te:"Java",st:"re",c:2,d:"il y a 4 mois",a:"Yannick Adjovi",v:"v1 vers v2 (démo)",steps:"Lister les champs renommés|Ajouter une couche d'adaptation|Tester les deux versions",code:EX+"Map<String,Object> adapt(Map<String,Object> v1){\n  v1.put(\"payerMessage\", v1.remove(\"note\"));\n  return v1;\n}",x:"Champ facultatif devenu obligatoire|Peu de confirmations"},
{id:6,t:"Construire un menu USSD à plusieurs niveaux",s:"Gérer la session, les timeouts et le retour en arrière dans un menu USSD.",p:"Sénégal",sv:"USSD",te:"Node.js",st:"new",c:1,d:"hier",a:"Moussa Camara",v:"Passerelle générique",steps:"Stocker le chemin de saisie|Afficher le menu courant|Gérer le retour avec 0",code:EX+"const path = text.split('*');\nreturn path.length === 1 ? menu() : sub(path);",x:"Session expirée sans message|Une seule vérification pour l'instant"},
{id:7,t:"Rendre une appli utilisable avec une connexion instable",s:"File d'attente locale, relances et idempotence pour les paiements.",p:"Togo",sv:"Hébergement",te:"JavaScript",st:"ok",c:11,d:"il y a 2 sem.",a:"Awa Ndiaye",v:"Navigateurs récents",steps:"Mettre les actions en file locale|Relancer avec délai croissant|Envoyer une clé d'idempotence",code:EX+"async function send(job){\n  for (let i=0;i<4;i++){\n    try { return await post(job); }\n    catch { await sleep(2**i*500); }\n  }\n}",x:"Doublons si la clé change|Stockage local limité"}];
FI[1].code=EX+"$payload = ksort_copy($fields);\n$sig = hash_hmac('sha256', http_build_query($payload), $SECRET);";
const NO=[{id:1,t:"Koffi Yao a confirmé votre fiche",f:7,r:0},{id:2,t:"Une fiche que vous suivez (SMS) est à revérifier",f:3,r:0},{id:3,t:"Une variante a été proposée sur votre fiche",f:1,r:1}];
const S={v:'home',id:null,q:'',f:{p:'',s:'',t:'',st:''},sort:'rel',fav:new Set([2]),u:null,adm:false,load:false,tab:'pub',auth:'in',prev:false,d:{},a:{},e:{},m:null,toast:'',drafts:[],rep:[{id:1,f:4,ty:"Information trompeuse",by:"k.diallo",st:'ouvert',d:"hier"},{id:2,f:5,ty:"Incompatibilité de version",by:"m.sow",st:'ouvert',d:"il y a 3 j"},{id:3,f:3,ty:"Solution obsolète",by:"a.traore",st:'ouvert',d:"il y a 1 sem."}],nid:100};
const B=st=>`<span class="b ${st}">${STL[st]}</span>`,fi=id=>FI.find(f=>f.id==id);
function go(v,id){S.v=v;S.id=id??null;S.prev=false;S.m=null;S.e={};render();scrollTo(0,0)}
function tt(m){S.toast=m;render();clearTimeout(tt.t);tt.t=setTimeout(()=>{S.toast='';render()},2600)}
function need(){if(!S.u){S.auth='in';go('auth');tt('Connectez-vous pour contribuer');return true}}
function card(f){return`<article class="card fc" tabindex="0" onclick="go('fiche',${f.id})" onkeydown="if(event.key==='Enter')go('fiche',${f.id})"><div class="row">${B(f.st)}<span class="mu">${f.c} confirmation${f.c>1?'s':''}</span></div><h3>${esc(f.t)}</h3><p class="mu" style="margin:0">${esc(f.s)}</p><div class="row"><span class="ch">${esc(f.p)}</span><span class="ch">${esc(f.sv)}</span><span class="ch">${esc(f.te)}</span></div><div class="mu">Dernière vérification : ${f.d} · ${esc(f.a)}</div></article>`}
const vis=()=>FI.filter(f=>!f.hid);
function logo(sz=30){return`<svg width="${sz}" height="${sz}" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--pr)"/><path d="M7 9h18v11H15l-5 4v-4H7z" fill="var(--pt)"/><path d="M13 12.5l-2.5 2 2.5 2M19 12.5l2.5 2-2.5 2" stroke="var(--pr)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`}
function head(){const n=NO.filter(x=>!x.r).length,t=(v,l)=>`<button class="${S.v==v?'on':''}" onclick="go('${v}')">${l}</button>`;return`<header><div class="hd"><button class="logo" onclick="go('home')" aria-label="Accueil Palabre">${logo()}Palabre</button><nav aria-label="Navigation principale">${t('search','Explorer')}${t('browse','Catégories')}${t('pub','Publier')}${S.u?t('dash','Tableau de bord')+t('notif','Notifications'+(n?' ('+n+')':''))+t('prof','Profil'):''}${t('help','Aide')}${S.adm?t('admin','Admin'):''}</nav>${S.u?`<button class="btn s sm" onclick="S.u=null;S.adm=false;go('home')">Déconnexion</button>`:`<button class="btn sm" onclick="S.auth='in';go('auth')">Connexion</button>`}</div></header>`}
function sbar(){return`<div class="sb"><input id="q" type="search" placeholder="Ex. : erreur callback Wave Sénégal" aria-label="Rechercher une solution" value="${esc(S.q)}" onkeydown="if(event.key==='Enter')doS()"><button class="btn" onclick="doS()">Rechercher</button></div>`}
function doS(){S.q=$('#q').value;S.load=true;go('search');setTimeout(()=>{S.load=false;render()},350)}
const V={};
V.home=()=>`<section class="hero"><h1>La bonne solution, testée chez vous.</h1><p>Palabre rassemble des fiches de terrain : des solutions techniques adaptées à l'Afrique, datées et confirmées par d'autres développeurs.</p>${sbar()}<div class="row"><button class="btn" onclick="go('search')">Explorer les solutions</button><button class="btn s" onclick="go('pub')">Partager une solution</button></div></section>
<h2>Comment ça marche</h2><div class="grid" style="margin-bottom:28px">${[['1. Cherchez','Filtrez par pays, opérateur et technologie.'],['2. Appliquez','Suivez les étapes et copiez le code.'],['3. Confirmez','Dites si ça marche dans votre contexte : la fraîcheur reste visible.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu" style="margin:0">${x[1]}</p></div>`).join('')}</div>
<h2>Solutions récentes</h2><div class="grid">${vis().slice(0,3).map(card).join('')}</div>
<h2 style="margin-top:28px">Une validation honnête</h2><div class="card"><p style="margin-top:0">Une confirmation vaut pour un contexte précis (pays, service, version). Une fiche sans confirmation récente est marquée « à revérifier » : cela ne veut pas dire qu'elle est fausse.</p><div class="row">${['ok','re','fl','new'].map(B).join('')}</div></div>
<footer class="mu" style="margin-top:32px">Palabre · CADev 2026 · <a href="#" onclick="go('help');return false">Aide</a> · Données de démonstration</footer>`;
V.auth=()=>{const up=S.auth=='up',e=S.e,a=S.a,f=(id,l,t,x='')=>`<label for="${id}">${l}</label><input id="${id}" type="${t}" class="${e[id]?'bad':''}" value="${esc(a[id])}" oninput="S.a.${id}=this.value" ${x}>${e[id]?`<div class="fe" role="alert">${e[id]}</div>`:''}`;
return`<div class="card" style="max-width:440px;margin:auto"><div class="tabs"><button class="${up?'':'on'}" onclick="S.auth='in';S.e={};render()">Connexion</button><button class="${up?'on':''}" onclick="S.auth='up';S.e={};render()">Inscription</button></div>
${up?f('user','Nom d\'utilisateur','text'):''}${f('email',up?'Adresse e-mail':'E-mail ou identifiant','text')}${f('pw','Mot de passe','password')}${up?f('pw2','Confirmer le mot de passe','password')+`<label style="font-weight:400"><input type="checkbox" id="cg" style="width:auto;min-height:0" onchange="S.a.cg=this.checked"> J'accepte les conditions d'utilisation</label>${e.cg?`<div class="fe" role="alert">${e.cg}</div>`:''}`:`<p><a href="#" onclick="S.auth='fg';render();return false">Mot de passe oublié ?</a></p>`}
${S.auth=='fg'?'':`<button class="btn" style="width:100%;margin-top:12px" onclick="doAuth()">${up?'Créer mon compte':'Se connecter'}</button>`}
${S.auth=='fg'?`<p>Saisissez votre e-mail, nous vous enverrons un lien (simulation).</p><button class="btn" onclick="S.auth='sent';render()">Envoyer le lien</button>`:''}
<p class="mu">Astuce démo : un identifiant commençant par « admin » ouvre l'espace de modération.</p></div>`};
function doAuth(){const a=S.a,e={},up=S.auth=='up';if(!a.email)e.email='Champ obligatoire.';else if(up&&!/^\S+@\S+\.\S+$/.test(a.email))e.email='Adresse e-mail invalide.';
if(up&&(a.user||'').length<3)e.user='3 caractères minimum.';if((a.pw||'').length<8)e.pw=up?'8 caractères minimum.':'Identifiant ou mot de passe incorrect.';
if(up&&a.pw!==a.pw2)e.pw2='Les mots de passe ne correspondent pas.';if(up&&!a.cg)e.cg='Veuillez accepter les conditions.';
S.e=e;if(Object.keys(e).length)return render();S.u=up?a.user:a.email.split('@')[0];S.adm=/^admin/i.test(a.email);S.a={};go(up?'onb':'dash')}
V.onb=()=>`<div class="card" style="max-width:520px;margin:auto"><h2>Bienvenue, ${esc(S.u)} !</h2><p class="mu">Tout est facultatif, vous pouvez passer.</p><label for="op">Pays</label><select id="op"><option value="">—</option>${PAYS.map(p=>`<option>${p}</option>`).join('')}</select><label>Technologies</label><div class="row">${TE.map(t=>`<label style="font-weight:400;margin:0"><input type="checkbox" style="width:auto;min-height:0"> ${t}</label>`).join('')}</div><div class="row" style="margin-top:16px"><button class="btn" onclick="go('dash');tt('Profil configuré')">Terminer</button><button class="btn s" onclick="go('dash')">Passer</button></div></div>`;
V.dash=()=>{if(!S.u)return V.denied();const rv=vis().filter(f=>f.st=='re'||f.st=='new');return`<h1 style="font-size:1.8rem">Bonjour ${esc(S.u)}</h1>${sbar()}<div class="row" style="margin-bottom:16px"><button class="btn" onclick="go('pub')">Publier une fiche</button><button class="btn s" onclick="S.tab='fav';go('prof')">Mes favoris</button></div>
<h2>À vérifier</h2><p class="mu">Ces fiches ont besoin d'un test récent dans votre contexte.</p><div class="grid">${rv.map(card).join('')}</div><h2 style="margin-top:24px">Récemment confirmées</h2><div class="grid">${vis().filter(f=>f.st=='ok').slice(0,3).map(card).join('')}</div>`};
V.denied=()=>`<div class="card em"><h2>Accès non autorisé</h2><p class="mu">Cette page demande une connexion${S.v=='admin'?' avec des droits de modération':''}.</p><button class="btn" onclick="S.auth='in';go('auth')">Se connecter</button></div>`;
function filt(){const q=S.q.toLowerCase(),F=S.f;let r=vis().filter(f=>(!q||(f.t+f.s+f.p+f.sv+f.te).toLowerCase().includes(q))&&(!F.p||f.p==F.p)&&(!F.s||f.sv==F.s)&&(!F.t||f.te==F.t)&&(!F.st||f.st==F.st));if(S.sort=='c')r.sort((a,b)=>b.c-a.c);return r}
V.search=()=>{const F=S.f,sel=(k,l,o)=>`<select aria-label="${l}" onchange="S.f.${k}=this.value;S.load=true;render();setTimeout(()=>{S.load=false;render()},300)"><option value="">${l}</option>${o.map(x=>`<option value="${x[0]}" ${F[k]==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
const r=filt(),ch=Object.entries(F).filter(x=>x[1]).map(x=>`<button class="ch" onclick="S.f.${x[0]}='';render()" aria-label="Retirer le filtre ${esc(STL[x[1]]||x[1])}">${esc(STL[x[1]]||x[1])} ✕</button>`).join('');
return`<h1 style="font-size:1.8rem">Explorer les solutions</h1>${sbar()}<div class="fl2">${sel('p','Pays',PAYS.map(x=>[x,x]))}${sel('s','Service',SV.map(x=>[x,x]))}${sel('t','Technologie',TE.map(x=>[x,x]))}${sel('st','Statut',Object.entries(STL))}</div>
<div class="row" style="margin:12px 0;justify-content:space-between"><div class="row">${ch}</div><div class="row"><span class="mu">${S.load?'Chargement…':r.length+' résultat'+(r.length>1?'s':'')}</span><select aria-label="Trier" style="width:auto" onchange="S.sort=this.value;render()"><option value="rel">Pertinence</option><option value="c" ${S.sort=='c'?'selected':''}>Plus confirmées</option></select></div></div>
${S.load?'<div class="sk"></div><div class="sk"></div><div class="sk"></div>':r.length?`<div class="grid">${r.map(card).join('')}</div>`:`<div class="card em"><h2>Aucune solution trouvée</h2><p class="mu">Essayez de retirer un filtre, de chercher un service plutôt qu'une erreur, ou de changer de pays.</p><div class="row" style="justify-content:center"><button class="btn s" onclick="S.f={p:'',s:'',t:'',st:''};S.q='';render()">Réinitialiser</button><button class="btn" onclick="go('pub')">Publier une nouvelle fiche</button></div></div>`}`};
V.browse=()=>`<h1 style="font-size:1.8rem">Catégories et pays</h1><h2>Services</h2><div class="grid">${SV.map(s=>`<button class="card" style="text-align:left;cursor:pointer" onclick="S.f={p:'',s:'${s}',t:'',st:''};S.q='';go('search')"><h3>${s}</h3><span class="mu">${vis().filter(f=>f.sv==s).length} fiche(s) de démo</span></button>`).join('')}</div><h2 style="margin-top:24px">Pays</h2><div class="row">${PAYS.map(p=>`<button class="ch" style="cursor:pointer;padding:8px 14px" onclick="S.f={p:'${p.replace(/'/g,"\\'")}',s:'',t:'',st:''};S.q='';go('search')">${p}</button>`).join('')}</div><p class="mu">Couverture partielle : quelques pays servent d'exemples.</p>`;
function body(f){const s=f.steps.split('|'),x=(f.x||'').split('|');return`<h3>Problème</h3><p>${esc(f.s)}</p><div class="row"><span class="ch">${esc(f.p)}</span><span class="ch">${esc(f.sv)}</span><span class="ch">${esc(f.te)}</span><span class="ch">${esc(f.v)}</span></div>
<h3 style="margin-top:20px">Prérequis</h3><p>Compte de test chez le fournisseur et URL publique en HTTPS.</p><h3>Étapes</h3><ol>${s.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>
<h3>Code</h3><div class="row" style="justify-content:space-between"><span class="mu">Exemple de démonstration</span>${f.id?`<button class="btn s sm" onclick="cp(${f.id})">Copier le code</button>`:''}</div><pre>${esc(f.code)}</pre>
<h3>Erreurs fréquentes</h3><p>${esc(x[0])}</p><h3>Limites connues</h3><p>${esc(x[1]||'—')}</p><h3>Variantes</h3><p class="mu">Aucune variante publiée pour un autre pays.</p>`}
function cp(id){try{navigator.clipboard.writeText(fi(id).code).then(()=>tt('Code copié'),()=>tt('Copie impossible : sélectionnez le texte'))}catch{tt('Copie impossible : sélectionnez le texte')}}
V.fiche=()=>{const f=fi(S.id);if(!f)return'';const fv=S.fav.has(f.id),n={re:`<div class="bn re" role="status"><b>À revérifier.</b> Dernière confirmation ${f.d}. Cela ne prouve pas que la solution est fausse : testez-la dans votre contexte et dites-nous.</div>`,fl:`<div class="bn fl" role="status"><b>Signalée.</b> Un contributeur a observé un comportement différent. Connu : la solution a fonctionné ${f.c} fois. Incertain : sur quelles versions elle échoue.</div>`}[f.st]||'';
return`<p><a href="#" onclick="go('search');return false">← Retour aux résultats</a></p><div class="lay"><article><div class="row">${B(f.st)}</div><h1 style="font-size:1.9rem;margin-top:8px">${esc(f.t)}</h1><p class="mu">Par <a href="#" onclick="go('dev',null);return false">${esc(f.a)}</a> · dernière vérification : ${f.d}</p>${n}${body(f)}</article>
<aside><div class="card"><h3>Communauté</h3><p class="mu" style="margin-top:0">${f.c} confirmation${f.c>1?'s':''} · contextes testés : ${esc(f.p)}</p><div style="display:grid;gap:8px"><button class="btn" onclick="act('confirm',${f.id})">Ça marche chez moi</button><button class="btn s" onclick="act('report',${f.id})">Signaler un problème</button><button class="btn s" onclick="act('var',${f.id})">Proposer une variante</button><button class="btn s" onclick="togF(${f.id})" aria-pressed="${fv}">${fv?'★ Retirer des favoris':'☆ Ajouter aux favoris'}</button><button class="btn s" onclick="try{navigator.clipboard.writeText(location.href)}catch{};tt('Lien copié')">Partager</button></div></div>
<div class="card" style="margin-top:14px"><h3>Fiches similaires</h3>${vis().filter(x=>x.id!=f.id&&(x.sv==f.sv||x.p==f.p)).slice(0,3).map(x=>`<p style="margin:6px 0"><a href="#" onclick="go('fiche',${x.id});return false">${esc(x.t)}</a></p>`).join('')||'<p class="mu">Aucune pour l\'instant.</p>'}</div></aside></div>`};
function togF(id){S.fav.has(id)?S.fav.delete(id):S.fav.add(id);render();tt(S.fav.has(id)?'Ajoutée aux favoris':'Retirée des favoris')}
function act(t,id){if(need())return;if(t=='var'){tt('Proposition enregistrée dans « Mes contributions » (simulation)');return}S.m={t,id};render()}
function modal(){const m=S.m;if(!m)return'';const f=fi(m.id),h=(t,b,ok,cls='')=>`<div class="ov" role="dialog" aria-modal="true" aria-label="${t}"><div class="card md"><h2>${t}</h2>${b}<div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn s" onclick="S.m=null;render()">Annuler</button><button class="btn ${cls}" onclick="${ok}">Confirmer</button></div></div></div>`;
if(m.t=='confirm')return h('Confirmer cette solution',`<p class="mu">${esc(f.t)}</p><label for="mp">Pays testé</label><select id="mp">${PAYS.map(p=>`<option ${p==f.p?'selected':''}>${p}</option>`).join('')}</select><label for="mv">Version utilisée</label><input id="mv" value="${esc(f.v)}"><label>Résultat</label><label style="font-weight:400"><input type="radio" name="rs" value="ok" checked style="width:auto;min-height:0"> Ça fonctionne</label><label style="font-weight:400"><input type="radio" name="rs" value="ko" style="width:auto;min-height:0"> Ça ne fonctionne plus</label><label for="mr">Remarque (facultatif)</label><input id="mr">`,'doConf('+f.id+')');
if(m.t=='report')return h('Signaler cette fiche',`<label for="rt">Motif</label><select id="rt">${["Solution obsolète","Code incorrect","Information trompeuse","Incompatibilité de version","Problème de sécurité","Hors sujet","Autre"].map(x=>`<option>${x}</option>`).join('')}</select><label for="rx">Explication</label><textarea id="rx" style="font-family:inherit"></textarea>`,'doRep('+f.id+')');
if(m.t=='pub')return h('Publier cette fiche ?',`<p>Elle sera visible par tous, avec le statut « récente, peu vérifiée ».</p>`,'doPub()');
if(m.t=='hide')return h('Masquer cette fiche ?',`<p>${esc(f.t)}<br><span class="mu">Action tracée dans l'historique de modération.</span></p>`,'doMod('+m.r+',1)','d');
if(m.t=='rej')return h('Rejeter ce signalement ?',`<p class="mu">La fiche restera visible.</p>`,'doMod('+m.r+',0)')}
function doConf(id){const f=fi(id),ok=document.querySelector('[name=rs]:checked').value=='ok';S.m=null;if(ok){f.c++;f.d="à l'instant";if(f.st=='re')f.st='ok';tt('Confirmation enregistrée (simulation)')}else{S.rep.unshift({id:++S.nid,f:id,ty:"Ne fonctionne plus",by:S.u,st:'ouvert',d:"à l'instant"});f.st='re';tt('Test négatif enregistré : fiche à revérifier')}render()}
function doRep(id){S.rep.unshift({id:++S.nid,f:id,ty:$('#rt').value,by:S.u,st:'ouvert',d:"à l'instant"});S.m=null;tt('Signalement envoyé. Merci !')}
const REQ=[['t','Titre'],['p','Pays'],['pb','Description du problème'],['stp','Étapes de résolution']];
V.pub=()=>{const d=S.d,e=S.e;if(S.prev){const f={...d,t:d.t,s:d.pb,p:d.p,sv:d.sv||'—',te:d.te||'—',v:d.v||'—',steps:(d.stp||'').split('\n').filter(Boolean).join('|'),code:d.code||'',x:(d.lim||'')+'|'+(d.lim||''),st:'new'};return`<h1 style="font-size:1.6rem">Prévisualisation</h1><p class="mu">Voici exactement ce que verront les lecteurs.</p><div class="card">${B('new')}<h1 style="font-size:1.8rem;margin-top:8px">${esc(f.t)}</h1>${body({...f,id:0})}</div><div class="row" style="margin-top:16px"><button class="btn s" onclick="S.prev=false;render()">Modifier</button><button class="btn" onclick="S.m={t:'pub',id:1};render()">Publier</button></div>`}
const fld=(k,l,t='input',o)=>`<label for="${k}">${l}</label>${t=='select'?`<select id="${k}" class="${e[k]?'bad':''}" oninput="S.d.${k}=this.value;upd()"><option value="">—</option>${o.map(x=>`<option ${d[k]==x?'selected':''}>${x}</option>`).join('')}</select>`:t=='ta'?`<textarea id="${k}" class="${e[k]?'bad':''}" oninput="S.d.${k}=this.value;upd()">${esc(d[k])}</textarea>`:`<input id="${k}" class="${e[k]?'bad':''}" value="${esc(d[k])}" oninput="S.d.${k}=this.value;upd()">`}${e[k]?`<div class="fe" role="alert">${e[k]}</div>`:''}`;
return`<h1 style="font-size:1.8rem">Nouvelle fiche de terrain</h1><div class="card" style="max-width:720px"><div class="pg" role="progressbar" aria-label="Progression"><i id="pgi" style="width:${pgp()}%"></i></div><p class="mu" id="pgt">${pgp()/25}/4 champs obligatoires remplis</p>
<h3>1. Contexte</h3>${fld('t','Titre descriptif *')}<div class="two"><div>${fld('p','Pays *','select',PAYS)}</div><div>${fld('sv','Opérateur ou service','select',SV)}</div><div>${fld('te','Technologie','select',TE)}</div><div>${fld('v','Version d\'API ou SDK')}</div></div>
<h3 style="margin-top:20px">2. Solution</h3>${fld('pb','Description du problème *','ta')}${fld('stp','Étapes de résolution * (une par ligne)','ta')}${fld('code','Extrait de code','ta')}
<h3 style="margin-top:20px">3. Vérification</h3>${fld('res','Résultat obtenu après test','ta')}${fld('lim','Erreurs ou limites connues','ta')}
<div class="row" style="margin-top:20px"><button class="btn" onclick="toPrev()">Prévisualiser</button><button class="btn s" onclick="S.drafts.push({...S.d});tt('Brouillon sauvegardé')">Enregistrer le brouillon</button><button class="btn s" onclick="if(Object.keys(S.d).length&&!confirm('Quitter sans publier ? Votre saisie reste dans ce brouillon.'))return;go('dash')">Annuler</button></div></div>`};
const pgp=()=>REQ.filter(r=>S.d[r[0]]).length*25;
function upd(){const i=$('#pgi');if(i){i.style.width=pgp()+'%';$('#pgt').textContent=pgp()/25+'/4 champs obligatoires remplis'}}
function toPrev(){if(need())return;const e={};REQ.forEach(r=>{if(!S.d[r[0]])e[r[0]]='Champ obligatoire.'});S.e=e;if(Object.keys(e).length)return render();S.prev=true;render()}
function doPub(){const d=S.d,f={id:++S.nid,t:d.t,s:d.pb,p:d.p,sv:d.sv||'Autre',te:d.te||'—',st:'new',c:0,d:"à l'instant",a:S.u,v:d.v||'—',steps:d.stp.split('\n').filter(Boolean).join('|'),code:d.code||'',x:'—|'+(d.lim||'—')};FI.unshift(f);S.d={};S.m=null;go('fiche',f.id);tt('Fiche publiée (simulation)')}
V.prof=()=>{if(!S.u)return V.denied();const mine=FI.filter(f=>f.a==S.u),t=S.tab,L=t=='pub'?mine:t=='fav'?FI.filter(f=>S.fav.has(f.id)):[],T=(k,l)=>`<button class="${t==k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`;
return`<div class="row"><div style="width:56px;height:56px;border-radius:50%;background:var(--pr);color:var(--pt);display:grid;place-items:center;font-size:1.4rem;font-weight:700">${esc(S.u[0]||'?').toUpperCase()}</div><div><h1 style="font-size:1.6rem;margin:0">${esc(S.u)}</h1><span class="mu">Contributeur · ${mine.length} fiche(s) publiée(s)</span></div></div>
<div class="tabs">${T('pub','Mes fiches')}${T('dr','Brouillons ('+S.drafts.length+')')}${T('fav','Favoris ('+S.fav.size+')')}${T('set','Paramètres')}</div>
${t=='set'?`<div class="card" style="max-width:480px"><label for="b">Présentation</label><textarea id="b" style="font-family:inherit"></textarea><label for="l">Langue</label><select id="l"><option>Français</option><option>English</option></select><label style="font-weight:400"><input type="checkbox" checked style="width:auto;min-height:0"> Profil public</label><label style="font-weight:400"><input type="checkbox" checked style="width:auto;min-height:0"> Notifications utiles uniquement</label><div class="row" style="margin-top:12px"><button class="btn" onclick="tt('Paramètres enregistrés (simulation)')">Enregistrer</button><button class="btn d" onclick="if(confirm('Désactiver le compte ?')){S.u=null;go('home')}">Désactiver le compte</button></div></div>`:t=='dr'?(S.drafts.length?S.drafts.map(x=>`<div class="card" style="margin-bottom:8px"><b>${esc(x.t||'Sans titre')}</b> <button class="btn s sm" onclick="S.d={...S.drafts[${S.drafts.indexOf(x)}]};go('pub')">Reprendre</button></div>`).join(''):'<div class="card em"><p class="mu">Aucun brouillon.</p></div>'):L.length?`<div class="grid">${L.map(card).join('')}</div>`:`<div class="card em"><h2>${t=='fav'?'Aucun favori':'Aucune contribution pour l\'instant'}</h2><p class="mu">${t=='fav'?'Enregistrez des fiches pour les retrouver ici.':'Partagez votre première solution.'}</p><button class="btn" onclick="go('${t=='fav'?'search':'pub'}')">${t=='fav'?'Découvrir des solutions':'Publier une fiche'}</button></div>`}`};
V.dev=()=>`<h1 style="font-size:1.6rem">Awa Ndiaye</h1><p class="mu">Sénégal · Node.js, JavaScript · profil fictif</p><div class="row"><span class="b ok">2 fiches confirmées</span><span class="b new">25 confirmations reçues</span></div><h2 style="margin-top:20px">Fiches publiées</h2><div class="grid">${vis().filter(f=>f.a=='Awa Ndiaye').map(card).join('')}</div>`;
V.notif=()=>{if(!S.u)return V.denied();return`<h1 style="font-size:1.8rem">Notifications</h1>${NO.length?NO.map(n=>`<div class="card row" style="margin-bottom:8px;justify-content:space-between;${n.r?'opacity:.7':''}"><span>${n.r?'':'● '}${esc(n.t)}</span><button class="btn s sm" onclick="NO.find(x=>x.id==${n.id}).r=1;go('fiche',${n.f})">Ouvrir</button></div>`).join(''):'<div class="card em">Aucune notification.</div>'}<button class="btn s sm" onclick="NO.forEach(n=>n.r=1);render()">Tout marquer comme lu</button>`};
V.help=()=>`<h1 style="font-size:1.8rem">Aide</h1><div class="grid">${[['Chercher','Utilisez les filtres pays, service, technologie et statut.'],['Rédiger une bonne fiche','Un problème précis, des étapes testées, le contexte (pays, version).'],['Confirmer','Testez dans votre contexte, puis indiquez le résultat.'],['Statuts','Confirmée, à revérifier, signalée, récente : toujours écrits en toutes lettres.'],['Signaler','Choisissez un motif et expliquez ce que vous observez.'],['Règles','Jamais de clés ou secrets réels dans une fiche. Respect des autres contributeurs.']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu" style="margin:0">${x[1]}</p></div>`).join('')}</div>`;
V.admin=()=>{if(!S.adm)return V.denied();const o=S.rep.filter(r=>r.st=='ouvert');return`<h1 style="font-size:1.8rem">Modération</h1><div class="grid" style="margin-bottom:20px"><div class="card"><h2 style="margin:0">${o.length}</h2><span class="mu">Signalements en attente</span></div><div class="card"><h2 style="margin:0">${FI.filter(f=>f.st=='re').length}</h2><span class="mu">Fiches à revérifier</span></div><div class="card"><h2 style="margin:0">${FI.filter(f=>f.hid).length}</h2><span class="mu">Fiches masquées</span></div></div>
<div class="card tw"><table><tr><th>Fiche</th><th>Motif</th><th>Par</th><th>Date</th><th>Statut</th><th>Actions</th></tr>${S.rep.map(r=>`<tr><td><a href="#" onclick="go('fiche',${r.f});return false">${esc(fi(r.f).t.slice(0,38))}…</a></td><td>${esc(r.ty)}</td><td>${esc(r.by)}</td><td>${r.d}</td><td>${r.st}</td><td>${r.st=='ouvert'?`<button class="btn s sm" onclick="S.m={t:'rej',id:${r.f},r:${r.id}};render()">Rejeter</button> <button class="btn d sm" onclick="S.m={t:'hide',id:${r.f},r:${r.id}};render()">Masquer</button>`:'—'}</td></tr>`).join('')}</table></div>`};
function doMod(r,h){const x=S.rep.find(z=>z.id==r);x.st=h?'traité (masquée)':'rejeté';if(h)fi(x.f).hid=1;S.m=null;render();tt('Décision enregistrée dans l\'historique')}
function render(){if(S.v=='fiche'&&!fi(S.id))S.v='search';$('#app').innerHTML=head()+'<main>'+V[S.v]()+'</main>'+modal()+(S.toast?`<div class="ts" role="status">${esc(S.toast)}</div>`:'')}
render();
</script></body></html>
